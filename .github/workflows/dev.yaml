on:
  push:
    branches:
    - dev
    - e/refactor-to-remove-esri
  pull_request:
    branches:
    - master

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yaml
    with:
      ENV: dev
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
